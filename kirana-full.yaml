apiVersion: v1
kind: Namespace
metadata:
  name: kirana

---
# =========================
# MONGODB (WITH STORAGE)
# =========================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: kirana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: kirana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: mongo-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: kirana
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017

---
# =========================
# CATALOG SERVICE
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: kirana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: catalog
        image: rraju511/kirana:latest
        ports:
        - containerPort: 3000
  env:
  - name: MONGO_URL
    value: "mongodb://mongodb.kirana.svc.cluster.local:27017/kirana"

  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: kirana
spec:
  selector:
    app: catalog
  ports:
    - port: 3000
      targetPort: 3000

---
# =========================
# NGINX (USER + ADMIN UI)
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: kirana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: rraju511/kirana-nginx:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: kirana
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008
